name: REVATHI tests

on:
  push:
    paths: ["REVATHI/**", ".github/workflows/revathi-tests.yml"]
  pull_request:
    paths: ["REVATHI/**", ".github/workflows/revathi-tests.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: REVATHI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
