name: REVATHI tests

on:
  push:
    paths: ["REVATHI/**", ".github/workflows/revathi-tests.yml"]
  pull_request:
    paths: ["REVATHI/**", ".github/workflows/revathi-tests.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: REVATHI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee test-output.txt
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import re
          text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n=+\n", text)
          for block in blocks[1:11]:
              lines = [l for l in block.strip().splitlines() if l.strip()]
              head = lines[0] if lines else "?"
              tail = " | ".join(l.strip() for l in lines[-4:])
              print(f"::error title={head[:120]}::{tail[:900]}")
          PY
